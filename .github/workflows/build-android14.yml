name: Build OvO - android14-6.1 Manual

on:
  workflow_dispatch:

jobs:

  upload-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ovo-source
          path: ovo/

  build-ko:
    needs: upload-source
    runs-on: ubuntu-24.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libwxgtk3.2-dev \
            libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip repo

      - name: Download ovo source
        uses: actions/download-artifact@v4
        with:
          name: ovo-source
          path: ovo-module/

      - name: Sync android14-6.1 kernel (last good tag pinned)
        run: |
          mkdir android-kernel && cd android-kernel
          # 2024-10 tha last valid android14-6.1 release
          repo init --depth 1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b android14-6.1-2024-10 \
            --repo-rev=stable
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Setup Clang toolchain
        run: |
          cd android-kernel
          # Clang version jo android14-6.1 use karta hai
          CLANG_VERSION=$(cat common/build.config.constants | grep CLANG_VERSION | cut -d= -f2)
          echo "Using Clang: $CLANG_VERSION"

      - name: Prepare ovo module
        run: |
          cp -r ovo-module android-kernel/common/drivers/ovo
          # Makefile mein add karo
          echo 'obj-m += ovo/' >> android-kernel/common/drivers/Makefile
          echo 'source "drivers/ovo/Kconfig"' >> android-kernel/common/drivers/Kconfig

      - name: Build ovo.ko (Bazel)
        run: |
          cd android-kernel
          tools/bazel run \
            --config=fast \
            //common:kernel_aarch64_modules -- \
            --destdir=$PWD/../dist

      - name: Find and upload .ko
        run: |
          find dist/ -name "ovo.ko" | head -5
          ls -lh dist/*.ko 2>/dev/null || echo "Searching deeper..."
          find . -name "ovo.ko" 2>/dev/null

      - name: Upload ovo.ko
        uses: actions/upload-artifact@v4
        with:
          name: ovo-ko-android14-6.1-aarch64
          path: |
            dist/ovo.ko
            **/ovo.ko
          if-no-files-found: warn
